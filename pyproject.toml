[project]
name = "interstitial"
version = "0.1.0"
description = "v1 prototype of opportunistic MoE inference: anchored trunk, scavenged expert tier"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy",
    "safetensors",
    "transformers>=5.0",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py"]
dev = ["pytest"]

[project.scripts]
interstitial = "interstitial.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["interstitial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
